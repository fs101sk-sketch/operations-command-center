name: Inject safe enhancements

on:
  push:
    paths:
      - 'enhancements/**'
      - '.github/workflows/inject-safe-enhancements.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load delayed stable bootstrap
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- OCC SAFE ENHANCEMENTS 2026-09-03 -->'
          old='\n'.join([
              marker,
              '<script src="enhancements/calendar-views-v4.js?v=20260903-4"></script>',
              '<script src="enhancements/balance-2026-v4.js?v=20260903-4"></script>',
              '<script src="enhancements/library-add-fix.js?v=20260903-4"></script>'
          ])
          new='\n'.join([
              marker,
              '<script src="enhancements/bootstrap-v5.js?v=20260903-5"></script>'
          ])
          if new in s:
              pass
          elif old in s:
              s=s.replace(old,new,1)
          elif marker not in s and '</body>' in s:
              s=s.replace('</body>','\n'+new+'\n</body>',1)
          else:
              raise SystemExit('enhancement bootstrap block could not be updated safely')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate references
        run: |
          grep -q 'enhancements/bootstrap-v5.js?v=20260903-5' index.html
          test -s enhancements/bootstrap-v5.js
          test -s enhancements/calendar-views-v4.js
          test -s enhancements/balance-2026-v4.js
          test -s enhancements/library-add-fix.js
      - name: Commit loader change if needed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'Load delayed stable operations bootstrap'
          git push
