name: Inject safe enhancements

on:
  push:
    paths:
      - 'enhancements/**'
      - '.github/workflows/inject-safe-enhancements.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject isolated scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- OCC SAFE ENHANCEMENTS 2026-09-03 -->'
          block='''\n<!-- OCC SAFE ENHANCEMENTS 2026-09-03 -->\n<script src="enhancements/calendar-views.js?v=20260903-3"></script>\n<script src="enhancements/balance-2026.js?v=20260903-3"></script>\n<script src="enhancements/library-readonly.js?v=20260903-3"></script>\n'''
          if marker not in s:
              if '</body>' not in s:
                  raise SystemExit('index.html has no closing body tag')
              s=s.replace('</body>',block+'\n</body>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Validate unchanged core and script references
        run: |
          grep -q 'enhancements/calendar-views.js' index.html
          grep -q 'enhancements/balance-2026.js' index.html
          grep -q 'enhancements/library-readonly.js' index.html
          test -s enhancements/calendar-views.js
          test -s enhancements/balance-2026.js
          test -s enhancements/library-readonly.js
      - name: Commit injection if needed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'Load isolated calendar, balance, and read-only library enhancements'
          git push
