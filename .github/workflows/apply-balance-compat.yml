name: Apply balance 2026 compatibility patch

on:
  push:
    branches:
      - fix/balance-2026-private-data
    paths:
      - .github/workflows/apply-balance-compat.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/balance-2026-private-data
          fetch-depth: 0

      - name: Apply focused compatibility patch
        run: python .setup/patch_balance_compat.py

      - name: Verify generated source
        run: |
          test "$(sha256sum index.html | cut -d' ' -f1)" = "504ea06ccbca6facdac5a85626f70d55565f59b0b1d645871d3372e417208021"
          grep -q 'data-calendar-view="month"' index.html
          grep -q 'data-calendar-view="day"' index.html
          grep -q 'data-calendar-view="year"' index.html
          grep -q 'data-access-key="page-balance-2026"' index.html
          grep -q 'DecompressionStream' index.html
          python - <<'PY'
          from pathlib import Path
          source = Path('index.html').read_text(encoding='utf-8')
          pos = source.index('<style id="balance-2026-styles">')
          start = source.index('<script>', pos) + len('<script>')
          end = source.index('</script>', start)
          Path('/tmp/balance-2026.js').write_text(source[start:end], encoding='utf-8')
          PY
          node --check /tmp/balance-2026.js

      - name: Remove one-time tooling
        run: |
          rm -f .setup/patch_balance_compat.py
          rm -f .github/workflows/export-source-temporary.yml
          rm -f .github/workflows/apply-balance-compat.yml

      - name: Commit focused update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html supabase/migrations/20260903093000_add_private_balance_2026.sql .setup .github/workflows
          git diff --cached --quiet && exit 0
          git commit -m "Fix private 2026 balance loading without replacing existing data"
          git push origin HEAD:fix/balance-2026-private-data
